<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Análisis y Gráfico de Producto</title>
    <link rel="stylesheet" href="style.css">
    <!-- Importamos Chart.js para generar gráficos profesionales -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="container" style="max-width: 900px; margin-top: 40px;">
        <div class="card" style="border-top: 4px solid #4f46e5;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="product-title" style="color: #4f46e5;">Cargando análisis...</h2>
                <a href="index.html" class="btn-secondary" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem;">← Volver al Inicio</a>
            </div>
            
            <div id="product-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
                <!-- Métricas rápidas del producto -->
            </div>

            <div style="background: #f8fafc; padding: 20px; border-radius: 8px; position: relative; height: 350px;">
                <canvas id="movementChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        // Leemos los productos guardados en localStorage
        const products = JSON.parse(localStorage.getItem('stockflow_products')) || [];
        
        // Obtenemos el nombre del producto desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('nombre');

        const product = products.find(p => p.name.toLowerCase() === (productName || '').toLowerCase());

        const titleEl = document.getElementById('product-title');
        const statsEl = document.getElementById('product-stats');

        if (!product) {
            titleEl.textContent = 'Producto no encontrado';
            statsEl.innerHTML = '<p>No se encontró información para este producto en el inventario.</p>';
        } else {
            titleEl.textContent = `📈 Análisis de Rendimiento: ${product.name}`;
            
            const stockActual = product.stock || 0;
            const precioUnitario = product.price || 0;
            const valorTotalStock = stockActual * precioUnitario;

            statsEl.innerHTML = `
                <div style="background: #f1f5f9; padding: 14px; border-radius: 6px;">
                    <span style="font-size: 0.8rem; color: #64748b; display: block;">Categoría</span>
                    <strong style="font-size: 1.1rem; color: #1e293b;">${product.category || 'General'}</strong>
                </div>
                <div style="background: #f1f5f9; padding: 14px; border-radius: 6px;">
                    <span style="font-size: 0.8rem; color: #64748b; display: block;">Stock Actual</span>
                    <strong style="font-size: 1.1rem; color: #2563eb;">${stockActual} unidades</strong>
                </div>
                <div style="background: #f1f5f9; padding: 14px; border-radius: 6px;">
                    <span style="font-size: 0.8rem; color: #64748b; display: block;">Precio de Venta</span>
                    <strong style="font-size: 1.1rem; color: #059669;">$${precioUnitario.toLocaleString('es-AR')}</strong>
                </div>
            `;

            // Generamos el gráfico de movimiento simulado/histórico basado en su rotación
            const ctx = document.getElementById('movementChart').getContext('2d');
            
            // Simulamos datos de ventas semanales/mensuales para proyección comercial
            const salesData = [
                Math.round(stockActual * 0.2), 
                Math.round(stockActual * 0.35), 
                Math.round(stockActual * 0.5), 
                Math.round(stockActual * 0.75)
            ];

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4 (Actual)'],
                    datasets: [{
                        label: 'Unidades Comercializadas / Rotación',
                        data: salesData,
                        backgroundColor: '#4f46e5',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#e2e8f0' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
