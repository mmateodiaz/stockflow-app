<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Control de Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📦 StockFlow</h1>
        <p>Control de inventario ágil y eficiente</p>
    </header>

    <main class="container">
        <!-- Formulario para agregar productos -->
        <section class="card">
            <h2>Agregar Nuevo Producto</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="name">Nombre del producto:</label>
                    <input type="text" id="name" required placeholder="Ej. Harina 000">
                </div>
                <div class="form-group">
                    <label for="category">Categoría:</label>
                    <input type="text" id="category" required placeholder="Ej. Almacén">
                </div>
                <div class="form-group">
                    <label for="stock">Stock Actual:</label>
                    <input type="number" id="stock" required min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="minStock">Stock Mínimo (Alerta):</label>
                    <input type="number" id="minStock" required min="0" placeholder="5">
                </div>
                <button type="submit" class="btn-primary">Guardar Producto</button>
            </form>
        </section>

        <!-- Listado de productos -->
        <section class="card">
            <h2>Inventario Actual</h2>
            <div class="search-container" style="margin-bottom: 15px;">
        <input type="text" id="search-input" placeholder="🔍 Buscar producto por nombre o categoría..." style="width: 100%; padding: 10px; border: 1px solid var(--border-color, #cbd5e1); border-radius: 6px; font-size: 0.95rem;">
    </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Stock</th>
                            <th>Mínimo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <!-- Los productos se cargan dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
            <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Stock</th>
                    <th>Mínimo</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="product-list">
                <!-- Los productos se cargan dinámicamente con JS -->
            </tbody>
        </table>
    </div>

    <!-- Agregá el botón de ordenar acá abajo -->
    <div style="margin-top: 16px; display: flex; justify-content: flex-end;">
        <button id="btn-sort" class="btn-secondary">🔤 Ordenar Alfabéticamente (A-Z)</button>
    </div>

</section> <!-- Cierre de la sección -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
