<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockFlow - Reporte Detallado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" style="max-width: 800px; margin-top: 40px;">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="report-title" style="color: var(--primary);">Cargando reporte...</h2>
                <a href="index.html" class="btn-secondary" style="text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem;">← Volver al Inicio</a>
            </div>
            
            <div id="report-content">
                <!-- El contenido detallado se inyectará por JavaScript -->
            </div>
        </div>
    </main>

    <script>
        // Leemos los productos guardados en el navegador
        const products = JSON.parse(localStorage.getItem('stockflow_products')) || [];
        
        // Identificamos qué tipo de reporte hay que mostrar según la URL o parámetro
        const urlParams = new URLSearchParams(window.location.search);
        const tipo = urlParams.get('tipo');

        const titleEl = document.getElementById('report-title');
        const contentEl = document.getElementById('report-content');

        if (tipo === 'inventario') {
            titleEl.textContent = '📊 Valor Total y Detalle del Inventario';
            const totalValue = products.reduce((acc, p) => acc + ((p.price || 0) * (p.stock || 0)), 0);
            const formattedTotal = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(totalValue);

            contentEl.innerHTML = `
                <div style="background: #f8fafc; padding: 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #059669;">
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Valor Monetario Total del Stock:</p>
                    <h3 style="color: #059669; font-size: 1.8rem; margin-top: 4px;">${formattedTotal}</h3>
                </div>
                <h3>Desglose por Producto</h3>
                <div class="table-responsive" style="margin-top: 12px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Precio Unitario</th>
                                <th style="text-align: right;">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${products.length === 0 ? '<tr><td colspan="5" style="text-align: center;">No hay productos cargados.</td></tr>' : 
                                products.map(p => {
                                    const sub = (p.price || 0) * (p.stock || 0);
                                    return `<tr>
                                        <td><strong>${p.name}</strong></td>
                                        <td>${p.category || 'General'}</td>
                                        <td>${p.stock}</td>
                                        <td>$${(p.price || 0).toLocaleString('es-AR')}</td> <td style="text-align: right; font-weight: 600;">$${sub.toLocaleString('es-AR')}</td>
                                    </tr>`;
                                }).join('')
                            }
                        </tbody>
                    </table>
                </div>
            `;
        } else if (tipo === 'bebidas') {
            titleEl.textContent = '🥤 Reporte Exclusivo de Bebidas';
            const drinkProducts = products.filter(product => {
                const cat = (product.category || '').toLowerCase();
                return cat.includes('bebida') || cat.includes('alcohol') || cat.includes('jugo') || cat.includes('agua') || cat.includes('gaseosa') || cat.includes('vino') || cat.includes('cerveza');
            });
            const totalStock = drinkProducts.reduce((acc, p) => acc + (p.stock || 0), 0);

            contentEl.innerHTML = `
                <div style="background: #eff6ff; padding: 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #3b82f6;">
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Total de tipos de bebidas y unidades en stock:</p>
                    <h3 style="color: #1d4ed8; font-size: 1.5rem; margin-top: 4px;">${drinkProducts.length} Variedades | ${totalStock} Unidades totales</h3>
                </div>
                
                <div class="table-responsive" style="margin-top: 12px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Bebida</th>
                                <th>Subcategoría</th>
                                <th>Stock</th>
                                <th style="text-align: right;">Precio</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${drinkProducts.length === 0 ? '<tr><td colspan="4" style="text-align: center;">No hay bebidas registradas.</td></tr>' :
                                drinkProducts.map(p => `<tr>
                                    <td><strong>${p.name}</strong></td>
                                    <td><span style="background: #eff6ff; color: #1d4ed8; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${p.category}</span></td>
                                    <td>${p.stock}</td> <td style="text-align: right; color: #059669; font-weight: 600;">$${(p.price || 0).toLocaleString('es-AR')}</td>
                                </tr>`).join('')
                            }
                        </tbody>
                    </table>
                </div>
            `;
        } else if (tipo === 'faltantes') {
            titleEl.textContent = '⚠️ Reporte de Productos Faltantes y Críticos';
            const missing = products.filter(p => (p.stock || 0) <= (p.minStock || 5));

            contentEl.innerHTML = `
                <div style="background: #fef2f2; padding: 16px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #dc2626;">
                    <p style="font-size: 0.9rem; color: var(--text-secondary);">Productos que requieren reposición inmediata:</p>
                    <h3 style="color: #dc2626; font-size: 1.5rem; margin-top: 4px;">${missing.length} Productos en alerta</h3>
                </div>
                <div class="table-responsive" style="margin-top: 12px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Stock Actual</th>
                                <th style="text-align: right;">Stock Mínimo</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${missing.length === 0 ? '<tr><td colspan="4" style="text-align: center; color: #059669; font-weight: 600;">¡Excelente! No hay productos faltantes.</td></tr>' :
                                missing.map(p => `<tr>
                                    <td><strong>${p.name}</strong></td>
                                    <td>${p.category || 'General'}</td>
                                    <td style="color: #dc2626; font-weight: 700;">${p.stock}</td>
                                    <td style="text-align: right;">${p.minStock || 5}</td>
                                </tr>`).join('')
                            }
                        </tbody>
                    </table>
                </div>
            `;
        } else {
            titleEl.textContent = 'Reporte no encontrado';
            contentEl.innerHTML = '<p>Seleccioná una opción válida desde el menú principal.</p>';
        }
    </script>
</body>
</html>
